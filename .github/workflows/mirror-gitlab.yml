name: Mirror to GitLab

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "::warning::GITLAB_TOKEN secret is not set — skipping GitLab mirror push. See README for setup."
            exit 0
          fi
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/tryh4rd-26/adriteyo_das.git"
          git push gitlab HEAD:main --force
