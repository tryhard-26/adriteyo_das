<!DOCTYPE html>
<html lang="en">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme_preference');
        if (saved === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>

  <div class="shell">
    {{ partial "sidebar/nav.html" . }}

    <main class="content" id="main">
      {{ block "main" . }}{{ end }}
    </main>
  </div>

  {{ $siteJS := resources.Get "js/site.js" | js.Build (dict "targetPath" "js/site.js" "minify" hugo.IsProduction) }}
  <script src="{{ $siteJS.RelPermalink }}" defer></script>
</body>
</html>
