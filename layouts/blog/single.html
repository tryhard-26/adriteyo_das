{{ define "main" }}
<article class="post">
  <header class="post__head">
    <p class="hero__eyebrow"><a href="{{ "blog/" | relURL }}">/blog</a></p>
    <time class="post__date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
  </header>

  <div class="post__content" id="post-content">
    {{ .Content }}
  </div>

  <footer class="post__foot">
    <a class="text-link" href="{{ "blog/" | relURL }}">← Back to blog</a>
    <a class="text-link" href="{{ "#top" | relURL }}">Portfolio home</a>
  </footer>
</article>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"
  onload="const r = () => renderMathInElement(document.getElementById('post-content') || document.body, {
    delimiters: [
      {left: '$$', right: '$$', display: true},
      {left: '\\[', right: '\\]', display: true},
      {left: '$', right: '$', display: false},
      {left: '\\(', right: '\\)', display: false}
    ],
    throwOnError: false
  }); document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', r) : r();"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
{{ $blogJS := resources.Get "js/blog-figures.js" | js.Build (dict "targetPath" "js/blog-figures.js" "minify" hugo.IsProduction) }}
<script src="{{ $blogJS.RelPermalink }}" defer></script>
{{ end }}
