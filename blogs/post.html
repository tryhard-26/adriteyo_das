<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tryhard // blog reader</title>
    <link rel="icon" type="image/jpeg" href="/assets/img/razorbill.jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: {
                ignoreHtmlClass: 'mermaid|language-mermaid'
            },
            svg: {
                fontCache: 'global'
            },
            startup: {
                typeset: false
            }
        };
    </script>
    <script id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: #0c0a15;
            --text-main: #f1f5f9;
            --text-muted: #88888e;
            --accent-green: #10b981;
            --accent-purple: #f43f5e;
            --accent-blue: #06b6d4;
            --accent-yellow: #fbbf24;
            --border-color: #2b2b2f;
            --font-mono: 'IBM Plex Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-mono);
            font-size: 14px;
            line-height: 1.6;
            padding: 3rem 2rem;
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        /* Pure Monochrome Scanline Overlay */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            z-index: 9999;
            background-size: 100% 3px;
            pointer-events: none;
            opacity: 0.4;
        }

        .header {
            margin-bottom: 2.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
        }

        .header .path {
            color: var(--accent-green);
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 0.4rem;
        }

        .header .cmd {
            color: var(--accent-purple);
            font-weight: bold;
            font-size: 1rem;
        }

        .post-content {
            margin-top: 2rem;
        }

        /* Markdown rendered content styling */
        .post-content h1 {
            color: var(--accent-yellow);
            font-size: 1.8rem;
            margin-top: 2rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
            text-shadow: 0 0 8px rgba(251, 191, 36, 0.3);
        }

        .post-content h2 {
            color: var(--accent-blue);
            font-size: 1.4rem;
            margin-top: 1.8rem;
            margin-bottom: 0.8rem;
            text-shadow: 0 0 5px rgba(6, 182, 212, 0.2);
        }

        .post-content h3 {
            color: var(--accent-green);
            font-size: 1.15rem;
            margin-top: 1.5rem;
            margin-bottom: 0.6rem;
        }

        .post-content p {
            margin-bottom: 1.2rem;
            color: var(--text-main);
            text-align: justify;
        }

        .post-content a {
            color: var(--accent-blue);
            text-decoration: none;
            border-bottom: 1px dashed var(--accent-blue);
        }

        .post-content a:hover {
            color: var(--accent-green);
            border-bottom-color: var(--accent-green);
        }

        .post-content ul, .post-content ol {
            margin-bottom: 1.2rem;
            padding-left: 1.5rem;
        }

        .post-content li {
            margin-bottom: 0.4rem;
        }

        .post-content pre {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 1rem;
            overflow-x: auto;
            margin-bottom: 1.5rem;
        }

        .post-content code {
            font-family: var(--font-mono);
            font-size: 13px;
            background-color: #1a1a24;
            padding: 0.1rem 0.3rem;
            color: var(--accent-yellow);
        }

        .post-content pre code {
            background-color: transparent;
            padding: 0;
            color: var(--text-main);
            display: block;
        }

        .post-content blockquote {
            border-left: 3px solid var(--accent-green);
            padding-left: 1rem;
            margin-bottom: 1.2rem;
            color: var(--text-muted);
            font-style: italic;
        }

        .post-content img {
            max-width: 100%;
            height: auto;
            border: 1px solid var(--border-color);
            margin: 1.5rem 0;
        }

        /* Math and diagram styling */
        .math-block {
            overflow-x: auto;
            overflow-y: hidden;
            padding: 0.75rem 0;
            margin: 1.2rem 0;
            text-align: center;
        }

        mjx-container {
            color: var(--text-main) !important;
            outline: none !important;
        }

        mjx-container[display="true"] {
            display: block !important;
            margin: 1.2rem 0 !important;
            overflow-x: auto !important;
            overflow-y: hidden !important;
        }

        /* Diagram styling & live animations */
        .svg-diagram {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 1.5rem 1rem;
            margin: 2rem 0;
            border-radius: 8px;
            overflow-x: auto;
            display: flex;
            justify-content: center;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .svg-diagram:hover {
            border-color: var(--accent-green);
            box-shadow: 0 6px 30px rgba(16, 185, 129, 0.15);
        }

        .diagram-svg {
            max-width: 100%;
            height: auto;
        }

        /* Continuous animated flow along connection arrows */
        .diagram-svg path[stroke-width],
        .diagram-svg line[stroke-width] {
            stroke-dasharray: 6 4;
            animation: diagramFlow 20s linear infinite;
        }

        @keyframes diagramFlow {
            from { stroke-dashoffset: 200; }
            to { stroke-dashoffset: 0; }
        }

        /* Interactive hover glow on diagram nodes */
        .diagram-svg rect[rx] {
            transition: filter 0.2s ease, transform 0.2s ease;
            cursor: pointer;
        }

        .diagram-svg rect[rx]:hover {
            filter: brightness(1.3) drop-shadow(0 0 8px currentColor);
        }

        /* Concept Check / Intuition Callout */
        .concept-check {
            background: #0d0b16;
            border: 1px solid var(--border-color);
            border-left: 3px solid var(--accent-green);
            border-radius: 6px;
            padding: 1.2rem 1.4rem;
            margin: 2rem 0;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .concept-check-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--accent-green);
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .concept-check-q {
            font-size: 14px;
            color: var(--text-main);
            margin-bottom: 0.8rem;
            line-height: 1.55;
            font-weight: 500;
        }

        .concept-check details {
            margin-top: 0.5rem;
        }

        .concept-check details summary {
            cursor: pointer;
            font-size: 12px;
            color: var(--accent-yellow);
            font-family: var(--font-mono);
            user-select: none;
            transition: color 0.2s ease;
            outline: none;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .concept-check details summary:hover {
            color: var(--accent-green);
        }

        .concept-check details[open] summary {
            margin-bottom: 0.7rem;
            color: var(--accent-green);
        }

        .concept-check-ans {
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.65;
            padding-top: 0.6rem;
            border-top: 1px dashed var(--border-color);
        }

        /* Live Vision Architecture & Scaling Simulator */
        .vision-simulator {
            background: #08070e;
            border: 1px solid var(--accent-green);
            border-radius: 8px;
            padding: 1.6rem;
            margin: 2.5rem 0;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.18);
        }

        .simulator-header {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 0.6rem;
            flex-wrap: wrap;
        }

        .simulator-badge {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 10.5px;
            font-weight: bold;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .simulator-title {
            color: var(--text-main);
            font-size: 1.25rem;
            font-weight: 700;
        }

        .simulator-desc {
            color: var(--text-muted);
            font-size: 12.5px;
            line-height: 1.55;
            margin-bottom: 1.5rem;
        }

        .simulator-grid-view {
            display: grid;
            grid-template-columns: 1fr 140px;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            align-items: center;
        }

        @media (max-width: 650px) {
            .simulator-grid-view {
                grid-template-columns: 1fr;
            }
        }

        .simulator-controls {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .control-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        .control-label {
            color: var(--accent-yellow);
            font-weight: 600;
        }

        .control-val {
            color: var(--accent-green);
            font-family: var(--font-mono);
            font-weight: 700;
        }

        .control-slider {
            accent-color: var(--accent-green);
            cursor: pointer;
            width: 100%;
        }

        .patch-preview-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #0e0c18;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.8rem;
        }

        .patch-preview-title {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .patch-grid-svg {
            width: 100px;
            height: 100px;
            background: #06050a;
            border: 1px solid #2d2a3e;
            border-radius: 4px;
        }

        .patch-grid-svg rect {
            transition: fill 0.15s ease;
        }

        .patch-grid-svg rect:hover {
            fill: #10b981 !important;
        }

        /* Dual Memory Comparison Bar */
        .memory-compare-box {
            background: #0e0c18;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 1rem 1.2rem;
            margin-bottom: 1.5rem;
        }

        .memory-compare-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.8rem;
        }

        .memory-bar-item {
            margin-bottom: 0.8rem;
        }

        .memory-bar-item:last-child {
            margin-bottom: 0;
        }

        .memory-bar-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11.5px;
            margin-bottom: 0.3rem;
            font-family: var(--font-mono);
        }

        .bar-container {
            width: 100%;
            height: 8px;
            background: #1b1928;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill-clip {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #f43f5e);
            border-radius: 4px;
            transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bar-fill-siglip {
            height: 100%;
            background: #10b981;
            border-radius: 4px;
            transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .simulator-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 0.8rem;
            background: #0e0c18;
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 6px;
        }

        .stat-card {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .stat-label {
            font-size: 10.5px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .stat-val {
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--accent-blue);
            transition: color 0.2s ease;
        }

        /* Table styling */
        .post-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
            font-size: 13px;
            overflow-x: auto;
            display: block;
        }

        .post-content th, .post-content td {
            border: 1px solid var(--border-color);
            padding: 0.6rem 0.8rem;
            text-align: left;
        }

        .post-content th {
            background-color: var(--surface-color);
            color: var(--accent-yellow);
        }

        .post-content tr:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.03);
        }

        .back-links {
            margin-top: 4rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
            display: flex;
            justify-content: space-between;
        }

        .back-links a {
            color: var(--accent-purple);
            text-decoration: none;
            font-weight: bold;
        }

        .back-links a:hover {
            color: var(--accent-blue);
        }

        .error-message {
            color: var(--accent-purple);
            border: 1px dashed var(--accent-purple);
            padding: 1.5rem;
            margin-top: 2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header class="header">
        <h1 id="post-header-title" style="color: var(--accent-green); margin-bottom: 0.5rem; font-size: 1.8rem; letter-spacing: 1px;">/blogs/blog_src</h1>
    </header>

    <main>
        <div id="loading" style="color: var(--accent-yellow);">[ LOADING BLOG DATA... ]</div>
        <article class="post-content" id="post-content" style="display: none;"></article>
        <div class="error-message" id="error-container" style="display: none;"></div>
    </main>

    <footer class="back-links">
        <a href="index.html">&lt;-- Return to Blogs</a>
        <a href="../">Return to Portfolio</a>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Configure marked with a custom tokenizer that protects math blocks and inline math from markdown emphasis/italics
            const inlineMath = {
                name: 'inlineMath',
                level: 'inline',
                start(src) { return src.indexOf('$'); },
                tokenizer(src) {
                    const match = src.match(/^\$((?:[^\$\\]|\\.)+)\$/);
                    if (match) {
                        return {
                            type: 'inlineMath',
                            raw: match[0],
                            text: match[1]
                        };
                    }
                },
                renderer(token) {
                    return `$${token.text}$`;
                }
            };

            const blockMath = {
                name: 'blockMath',
                level: 'block',
                start(src) { return src.indexOf('$$'); },
                tokenizer(src) {
                    const match = src.match(/^\$\$([\s\S]+?)\$\$/);
                    if (match) {
                        return {
                            type: 'blockMath',
                            raw: match[0],
                            text: match[1]
                        };
                    }
                },
                renderer(token) {
                    return `<div class="math-block">$$${token.text}$$</div>`;
                }
            };

            marked.use({ extensions: [blockMath, inlineMath] });

            // Configure mermaid
            if (typeof mermaid !== "undefined") {
                mermaid.initialize({
                    startOnLoad: false,
                    theme: 'dark',
                    themeVariables: {
                        darkMode: true,
                        background: '#0c0a15',
                        primaryColor: '#10b981',
                        primaryTextColor: '#f1f5f9',
                        primaryBorderColor: '#2b2b2f',
                        lineColor: '#06b6d4',
                        secondaryColor: '#1a1a24',
                        tertiaryColor: '#0c0a15'
                    }
                });
            }

            // Get post source file from URL params
            const params = new URLSearchParams(window.location.search);
            const src = params.get('src');
            
            const headerTitle = document.getElementById('post-header-title');
            const contentElem = document.getElementById('post-content');
            const loadingElem = document.getElementById('loading');
            const errorElem = document.getElementById('error-container');

            if (!src) {
                showError("No source file specified in URL query. Usage: post.html?src=filename.md");
                return;
            }

            // Sanitize query to avoid directory traversal out of blog_src
            const cleanSrc = src.replace(/^.*[\\\/]/, '');
            const targetPath = "/blogs/blog_src/" + cleanSrc + "?t=" + Date.now();

            if (headerTitle) {
                headerTitle.textContent = `/blogs/blog_src/${cleanSrc}`;
            }

            // Fetch markdown content with cache buster
            fetch(targetPath, { cache: "no-store" })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Could not find specified blog: ${cleanSrc} (HTTP status ${response.status})`);
                    }
                    return response.text();
                })
                .then(async markdownText => {
                    // Render using Marked
                    const htmlContent = marked.parse(markdownText);
                    contentElem.innerHTML = htmlContent;

                    // Convert mermaid code blocks into mermaid divs
                    const codeBlocks = contentElem.querySelectorAll('pre code.language-mermaid, pre code.lang-mermaid');
                    codeBlocks.forEach(block => {
                        const pre = block.parentElement;
                        const div = document.createElement('div');
                        div.className = 'mermaid';
                        div.textContent = block.textContent;
                        pre.replaceWith(div);
                    });

                    // Show content first so SVG layout engines and MathJax can measure element dimensions
                    loadingElem.style.display = 'none';
                    contentElem.style.display = 'block';

                    // If viewing the foundational vision models post, mount live simulator after the intro
                    if (cleanSrc === 'foundational_vision_models_math.md' && !document.getElementById('vision-simulator')) {
                        const simulatorHTML = `
                        <div class="vision-simulator" id="vision-simulator">
                            <div class="simulator-header">
                                <span class="simulator-badge">Live Simulator</span>
                                <span class="simulator-title">Vision Architecture & Scaling Explorer</span>
                            </div>
                            <div class="simulator-desc">
                                Drag the sliders below to explore how image resolution and patch granularity drive the quadratic attention bottleneck, and how pairwise sigmoid loss in SigLIP dismantles the distributed all-gather memory wall.
                            </div>
                            <div class="simulator-grid-view">
                                <div class="simulator-controls">
                                    <div class="control-group">
                                        <div class="control-label-row">
                                            <span class="control-label">Image Resolution (H × W)</span>
                                            <span class="control-val" id="res-val">224 × 224 px</span>
                                        </div>
                                        <input type="range" class="control-slider" id="res-slider" min="1" max="4" value="1" step="1">
                                    </div>
                                    <div class="control-group">
                                        <div class="control-label-row">
                                            <span class="control-label">Patch Granularity (P × P)</span>
                                            <span class="control-val" id="patch-val">16 × 16 px</span>
                                        </div>
                                        <input type="range" class="control-slider" id="patch-slider" min="0" max="3" value="2" step="1">
                                    </div>
                                    <div class="control-group">
                                        <div class="control-label-row">
                                            <span class="control-label">Global Batch Size (B)</span>
                                            <span class="control-val" id="batch-val">32,768 pairs</span>
                                        </div>
                                        <input type="range" class="control-slider" id="batch-slider" min="1" max="6" value="4" step="1">
                                    </div>
                                </div>
                                <div class="patch-preview-card">
                                    <span class="patch-preview-title">Patch Grid</span>
                                    <svg class="patch-grid-svg" id="patch-svg" viewBox="0 0 100 100"></svg>
                                </div>
                            </div>

                            <div class="memory-compare-box">
                                <div class="memory-compare-title">Distributed Communication & Memory Footprint</div>
                                <div class="memory-bar-item">
                                    <div class="memory-bar-labels">
                                        <span style="color: #f43f5e;">Classic CLIP (Softmax AllGather)</span>
                                        <span id="clip-bar-text" style="color: #f43f5e; font-weight: bold;">2.1 GB</span>
                                    </div>
                                    <div class="bar-container">
                                        <div class="bar-fill-clip" id="clip-bar-fill" style="width: 25%;"></div>
                                    </div>
                                </div>
                                <div class="memory-bar-item">
                                    <div class="memory-bar-labels">
                                        <span style="color: #10b981;">Google SigLIP (Streamed Pairwise)</span>
                                        <span id="siglip-bar-text" style="color: #10b981; font-weight: bold;">0.5 MB</span>
                                    </div>
                                    <div class="bar-container">
                                        <div class="bar-fill-siglip" id="siglip-bar-fill" style="width: 2%;"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="simulator-stats">
                                <div class="stat-card">
                                    <span class="stat-label">Sequence Tokens (N)</span>
                                    <span class="stat-val" id="stat-n">196</span>
                                </div>
                                <div class="stat-card">
                                    <span class="stat-label">Attention Matrix Size</span>
                                    <span class="stat-val" id="stat-matrix">38.4k entries</span>
                                </div>
                                <div class="stat-card">
                                    <span class="stat-label">Attention FLOP Scale</span>
                                    <span class="stat-val" id="stat-mult">1.0× Baseline</span>
                                </div>
                                <div class="stat-card">
                                    <span class="stat-label">Distributed Network Sync</span>
                                    <span class="stat-val" id="stat-sync" style="color: #10b981; font-size: 1rem;">Zero AllGather</span>
                                </div>
                            </div>
                        </div>`;
                        
                        // Insert simulator right before section 1
                        const firstH2 = contentElem.querySelector('h2');
                        if (firstH2) {
                            firstH2.insertAdjacentHTML('beforebegin', simulatorHTML);
                        } else {
                            contentElem.insertAdjacentHTML('afterbegin', simulatorHTML);
                        }
                        initSimulator();
                    }

                    // Render MathJax formulas
                    if (window.MathJax) {
                        try {
                            if (window.MathJax.startup && window.MathJax.startup.promise) {
                                await window.MathJax.startup.promise;
                            }
                            if (window.MathJax.typesetPromise) {
                                await window.MathJax.typesetPromise([contentElem]);
                            }
                        } catch (mathErr) {
                            console.warn("MathJax rendering warning:", mathErr);
                        }
                    }

                    // Update document title dynamically based on first H1 or filename
                    const h1 = contentElem.querySelector('h1');
                    if (h1) {
                        document.title = `tryhard // ${h1.textContent}`;
                    } else {
                        document.title = `tryhard // ${cleanSrc.replace('.md', '')}`;
                    }
                })
                .catch(err => {
                    showError(err.message);
                });

            function initSimulator() {
                const resValues = [224, 384, 512, 1024];
                const patchValues = [8, 14, 16, 32];
                const batchValues = [256, 1024, 8192, 32768, 131072, 524288];

                const resSlider = document.getElementById('res-slider');
                const patchSlider = document.getElementById('patch-slider');
                const batchSlider = document.getElementById('batch-slider');
                const patchSvg = document.getElementById('patch-svg');

                if (!resSlider || !patchSlider || !batchSlider || !patchSvg) return;

                function update() {
                    const H = resValues[parseInt(resSlider.value) - 1];
                    const P = patchValues[parseInt(patchSlider.value)];
                    const B = batchValues[parseInt(batchSlider.value) - 1];

                    document.getElementById('res-val').textContent = `${H} × ${H} px`;
                    document.getElementById('patch-val').textContent = `${P} × ${P} px`;
                    document.getElementById('batch-val').textContent = `${B.toLocaleString()} pairs`;

                    const gridDim = Math.min(Math.floor(H / P), 32);
                    const N = Math.floor((H * H) / (P * P));
                    const matrixEntries = N * N;
                    const baselineN = Math.floor((224 * 224) / (16 * 16));
                    const mult = (matrixEntries / (baselineN * baselineN)).toFixed(1);

                    document.getElementById('stat-n').textContent = N.toLocaleString();
                    document.getElementById('stat-matrix').textContent = matrixEntries >= 1000000 ? `${(matrixEntries / 1000000).toFixed(2)}M cells` : `${(matrixEntries / 1000).toFixed(1)}k cells`;
                    document.getElementById('stat-mult').textContent = `${mult}× (${mult > 1 ? '+' + ((mult - 1)*100).toFixed(0) + '%' : 'Baseline'})`;

                    // Render mini SVG patch grid
                    const cellSize = 100 / Math.min(gridDim, 16);
                    const displayDim = Math.min(gridDim, 16);
                    let svgContent = '';
                    for (let r = 0; r < displayDim; r++) {
                        for (let c = 0; c < displayDim; c++) {
                            const isAlt = (r + c) % 2 === 0;
                            const fill = isAlt ? '#141224' : '#1e1a34';
                            svgContent += `<rect x="${c * cellSize}" y="${r * cellSize}" width="${cellSize - 0.5}" height="${cellSize - 0.5}" fill="${fill}"/>`;
                        }
                    }
                    patchSvg.innerHTML = svgContent;

                    // Memory calculations
                    const clipBytes = B * B * 2; // FP16 2 bytes
                    const clipMB = clipBytes / (1024 * 1024);
                    const clipGB = clipMB / 1024;
                    const maxDisplayGB = 128;
                    const clipPct = Math.min(100, Math.max(3, (clipGB / maxDisplayGB) * 100));

                    const clipBarFill = document.getElementById('clip-bar-fill');
                    const clipBarText = document.getElementById('clip-bar-text');
                    clipBarFill.style.width = `${clipPct}%`;

                    if (clipGB >= 16) {
                        clipBarText.textContent = `${clipGB.toFixed(1)} GB (ALLGATHER OOM RISK)`;
                        clipBarFill.style.background = '#ef4444';
                    } else if (clipGB >= 1) {
                        clipBarText.textContent = `${clipGB.toFixed(2)} GB (AllGather barrier)`;
                        clipBarFill.style.background = 'linear-gradient(90deg, #6366f1, #f43f5e)';
                    } else {
                        clipBarText.textContent = `${clipMB.toFixed(1)} MB (AllGather)`;
                        clipBarFill.style.background = 'linear-gradient(90deg, #6366f1, #f43f5e)';
                    }

                    const siglipBytes = 256 * Math.min(B, 1024) * 2;
                    const siglipMB = siglipBytes / (1024 * 1024);
                    const siglipBarFill = document.getElementById('siglip-bar-fill');
                    const siglipBarText = document.getElementById('siglip-bar-text');
                    siglipBarFill.style.width = '3%';
                    siglipBarText.textContent = `${Math.max(0.5, siglipMB).toFixed(1)} MB (Tiled Streaming)`;
                }

                resSlider.addEventListener('input', update);
                patchSlider.addEventListener('input', update);
                batchSlider.addEventListener('input', update);
                update();
            }

            function showError(msg) {
                loadingElem.style.display = 'none';
                errorElem.textContent = `[ ERROR: ${msg} ]`;
                errorElem.style.display = 'block';
            }
        });
    </script>
</body>
</html>
