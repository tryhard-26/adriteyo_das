<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tryhard // blog reader</title>
    <link rel="icon" type="image/jpeg" href="/assets/img/razorbill.jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: {
                ignoreHtmlClass: 'mermaid|language-mermaid'
            },
            svg: {
                fontCache: 'global'
            },
            startup: {
                typeset: false
            }
        };
    </script>
    <script id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: #0c0a15;
            --text-main: #f1f5f9;
            --text-muted: #88888e;
            --accent-green: #10b981;
            --accent-purple: #f43f5e;
            --accent-blue: #06b6d4;
            --accent-yellow: #fbbf24;
            --border-color: #2b2b2f;
            --font-mono: 'IBM Plex Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-mono);
            font-size: 14px;
            line-height: 1.6;
            padding: 3rem 2rem;
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        /* Pure Monochrome Scanline Overlay */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            z-index: 9999;
            background-size: 100% 3px;
            pointer-events: none;
            opacity: 0.4;
        }

        .header {
            margin-bottom: 2.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
        }

        .header .path {
            color: var(--accent-green);
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 0.4rem;
        }

        .header .cmd {
            color: var(--accent-purple);
            font-weight: bold;
            font-size: 1rem;
        }

        .post-content {
            margin-top: 2rem;
        }

        /* Markdown rendered content styling */
        .post-content h1 {
            color: var(--accent-yellow);
            font-size: 1.8rem;
            margin-top: 2rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
            text-shadow: 0 0 8px rgba(251, 191, 36, 0.3);
        }

        .post-content h2 {
            color: var(--accent-blue);
            font-size: 1.4rem;
            margin-top: 1.8rem;
            margin-bottom: 0.8rem;
            text-shadow: 0 0 5px rgba(6, 182, 212, 0.2);
        }

        .post-content h3 {
            color: var(--accent-green);
            font-size: 1.15rem;
            margin-top: 1.5rem;
            margin-bottom: 0.6rem;
        }

        .post-content p {
            margin-bottom: 1.2rem;
            color: var(--text-main);
            text-align: justify;
        }

        .post-content a {
            color: var(--accent-blue);
            text-decoration: none;
            border-bottom: 1px dashed var(--accent-blue);
        }

        .post-content a:hover {
            color: var(--accent-green);
            border-bottom-color: var(--accent-green);
        }

        .post-content ul, .post-content ol {
            margin-bottom: 1.2rem;
            padding-left: 1.5rem;
        }

        .post-content li {
            margin-bottom: 0.4rem;
        }

        .post-content pre {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 1rem;
            overflow-x: auto;
            margin-bottom: 1.5rem;
        }

        .post-content code {
            font-family: var(--font-mono);
            font-size: 13px;
            background-color: #1a1a24;
            padding: 0.1rem 0.3rem;
            color: var(--accent-yellow);
        }

        .post-content pre code {
            background-color: transparent;
            padding: 0;
            color: var(--text-main);
            display: block;
        }

        .post-content blockquote {
            border-left: 3px solid var(--accent-green);
            padding-left: 1rem;
            margin-bottom: 1.2rem;
            color: var(--text-muted);
            font-style: italic;
        }

        .post-content img {
            max-width: 100%;
            height: auto;
            border: 1px solid var(--border-color);
            margin: 1.5rem 0;
        }

        /* Math and diagram styling */
        .math-block {
            overflow-x: auto;
            overflow-y: hidden;
            padding: 0.75rem 0;
            margin: 1.2rem 0;
            text-align: center;
        }

        mjx-container {
            color: var(--text-main) !important;
            outline: none !important;
        }

        mjx-container[display="true"] {
            display: block !important;
            margin: 1.2rem 0 !important;
            overflow-x: auto !important;
            overflow-y: hidden !important;
        }

        /* Diagram styling & animation */
        .svg-diagram {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 1.5rem 1rem;
            margin: 1.8rem 0;
            border-radius: 6px;
            overflow-x: auto;
            display: flex;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transition: border-color 0.3s ease, transform 0.2s ease;
        }

        .svg-diagram:hover {
            border-color: var(--accent-green);
            transform: translateY(-1px);
        }

        .diagram-svg {
            max-width: 100%;
            height: auto;
        }

        /* Interactive Architecture Playground */
        .interactive-playground {
            background: #08070e;
            border: 1px solid var(--accent-green);
            border-radius: 8px;
            padding: 1.5rem;
            margin: 2.5rem 0;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.15);
        }

        .playground-title {
            color: var(--accent-green);
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .playground-desc {
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 1.5rem;
        }

        .playground-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.2rem;
            margin-bottom: 1.5rem;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .control-label {
            font-size: 12px;
            color: var(--accent-yellow);
            font-weight: 500;
        }

        .control-slider {
            accent-color: var(--accent-green);
            cursor: pointer;
        }

        .playground-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
            background: #0e0c18;
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 6px;
        }

        .stat-card {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .stat-val {
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--accent-blue);
        }

        /* Table styling */
        .post-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
            font-size: 13px;
            overflow-x: auto;
            display: block;
        }

        .post-content th, .post-content td {
            border: 1px solid var(--border-color);
            padding: 0.6rem 0.8rem;
            text-align: left;
        }

        .post-content th {
            background-color: var(--surface-color);
            color: var(--accent-yellow);
        }

        .post-content tr:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.03);
        }

        .back-links {
            margin-top: 4rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
            display: flex;
            justify-content: space-between;
        }

        .back-links a {
            color: var(--accent-purple);
            text-decoration: none;
            font-weight: bold;
        }

        .back-links a:hover {
            color: var(--accent-blue);
        }

        .error-message {
            color: var(--accent-purple);
            border: 1px dashed var(--accent-purple);
            padding: 1.5rem;
            margin-top: 2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header class="header">
        <h1 id="post-header-title" style="color: var(--accent-green); margin-bottom: 0.5rem; font-size: 1.8rem; letter-spacing: 1px;">/blogs/blog_src</h1>
    </header>

    <main>
        <div id="loading" style="color: var(--accent-yellow);">[ LOADING BLOG DATA... ]</div>
        <article class="post-content" id="post-content" style="display: none;"></article>
        <div class="error-message" id="error-container" style="display: none;"></div>
    </main>

    <footer class="back-links">
        <a href="index.html">&lt;-- Return to Blogs</a>
        <a href="../">Return to Portfolio</a>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Configure marked with a custom tokenizer that protects math blocks and inline math from markdown emphasis/italics
            const inlineMath = {
                name: 'inlineMath',
                level: 'inline',
                start(src) { return src.indexOf('$'); },
                tokenizer(src) {
                    const match = src.match(/^\$((?:[^\$\\]|\\.)+)\$/);
                    if (match) {
                        return {
                            type: 'inlineMath',
                            raw: match[0],
                            text: match[1]
                        };
                    }
                },
                renderer(token) {
                    return `$${token.text}$`;
                }
            };

            const blockMath = {
                name: 'blockMath',
                level: 'block',
                start(src) { return src.indexOf('$$'); },
                tokenizer(src) {
                    const match = src.match(/^\$\$([\s\S]+?)\$\$/);
                    if (match) {
                        return {
                            type: 'blockMath',
                            raw: match[0],
                            text: match[1]
                        };
                    }
                },
                renderer(token) {
                    return `<div class="math-block">$$${token.text}$$</div>`;
                }
            };

            marked.use({ extensions: [blockMath, inlineMath] });

            // Configure mermaid
            if (typeof mermaid !== "undefined") {
                mermaid.initialize({
                    startOnLoad: false,
                    theme: 'dark',
                    themeVariables: {
                        darkMode: true,
                        background: '#0c0a15',
                        primaryColor: '#10b981',
                        primaryTextColor: '#f1f5f9',
                        primaryBorderColor: '#2b2b2f',
                        lineColor: '#06b6d4',
                        secondaryColor: '#1a1a24',
                        tertiaryColor: '#0c0a15'
                    }
                });
            }

            // Get post source file from URL params
            const params = new URLSearchParams(window.location.search);
            const src = params.get('src');
            
            const headerTitle = document.getElementById('post-header-title');
            const contentElem = document.getElementById('post-content');
            const loadingElem = document.getElementById('loading');
            const errorElem = document.getElementById('error-container');

            if (!src) {
                showError("No source file specified in URL query. Usage: post.html?src=filename.md");
                return;
            }

            // Sanitize query to avoid directory traversal out of blog_src
            const cleanSrc = src.replace(/^.*[\\\/]/, '');
            const targetPath = "/blogs/blog_src/" + cleanSrc + "?t=" + Date.now();

            if (headerTitle) {
                headerTitle.textContent = `/blogs/blog_src/${cleanSrc}`;
            }

            // Fetch markdown content with cache buster
            fetch(targetPath, { cache: "no-store" })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Could not find specified blog: ${cleanSrc} (HTTP status ${response.status})`);
                    }
                    return response.text();
                })
                .then(async markdownText => {
                    // Render using Marked
                    const htmlContent = marked.parse(markdownText);
                    contentElem.innerHTML = htmlContent;

                    // Convert mermaid code blocks into mermaid divs
                    const codeBlocks = contentElem.querySelectorAll('pre code.language-mermaid, pre code.lang-mermaid');
                    codeBlocks.forEach(block => {
                        const pre = block.parentElement;
                        const div = document.createElement('div');
                        div.className = 'mermaid';
                        div.textContent = block.textContent;
                        pre.replaceWith(div);
                    });

                    // Show content first so SVG layout engines and MathJax can measure element dimensions
                    loadingElem.style.display = 'none';
                    contentElem.style.display = 'block';

                    // If viewing the foundational vision models post, mount interactive playground after the intro
                    if (cleanSrc === 'foundational_vision_models_math.md' && !document.getElementById('vision-playground')) {
                        const playgroundHTML = `
                        <div class="interactive-playground" id="vision-playground">
                            <div class="playground-title">
                                <span>⚡ Interactive Vision Scaling & Architecture Playground</span>
                            </div>
                            <div class="playground-desc">
                                Adjust resolution, patch size, and batch size to see real-time FLOP explosion, token count, and SigLIP vs Softmax memory scaling.
                            </div>
                            <div class="playground-controls">
                                <div class="control-group">
                                    <label class="control-label" id="res-label">Image Resolution: 224 x 224</label>
                                    <input type="range" class="control-slider" id="res-slider" min="1" max="4" value="1" step="1">
                                </div>
                                <div class="control-group">
                                    <label class="control-label" id="patch-label">Patch Size P: 16 x 16</label>
                                    <input type="range" class="control-slider" id="patch-slider" min="0" max="3" value="2" step="1">
                                </div>
                                <div class="control-group">
                                    <label class="control-label" id="batch-label">Batch Size B: 32,768</label>
                                    <input type="range" class="control-slider" id="batch-slider" min="1" max="6" value="4" step="1">
                                </div>
                            </div>
                            <div class="playground-stats">
                                <div class="stat-card">
                                    <span class="stat-label">Token Count (N)</span>
                                    <span class="stat-val" id="stat-n">196</span>
                                </div>
                                <div class="stat-card">
                                    <span class="stat-label">Self-Attention Matrix</span>
                                    <span class="stat-val" id="stat-matrix">38.4k entries</span>
                                </div>
                                <div class="stat-card">
                                    <span class="stat-label">Quadratic Multiplier</span>
                                    <span class="stat-val" id="stat-mult">1.0x (Baseline)</span>
                                </div>
                                <div class="stat-card">
                                    <span class="stat-label">CLIP Softmax Memory</span>
                                    <span class="stat-val" id="stat-clip" style="color: var(--accent-purple);">2.14 GB (AllGather)</span>
                                </div>
                                <div class="stat-card">
                                    <span class="stat-label">SigLIP Tiled Memory</span>
                                    <span class="stat-val" id="stat-siglip" style="color: var(--accent-green);">0.5 MB (Streamed)</span>
                                </div>
                            </div>
                        </div>`;
                        
                        // Insert playground right before section 1
                        const firstH2 = contentElem.querySelector('h2');
                        if (firstH2) {
                            firstH2.insertAdjacentHTML('beforebegin', playgroundHTML);
                        } else {
                            contentElem.insertAdjacentHTML('afterbegin', playgroundHTML);
                        }
                        initPlayground();
                    }

                    // Render MathJax formulas
                    if (window.MathJax) {
                        try {
                            if (window.MathJax.startup && window.MathJax.startup.promise) {
                                await window.MathJax.startup.promise;
                            }
                            if (window.MathJax.typesetPromise) {
                                await window.MathJax.typesetPromise([contentElem]);
                            }
                        } catch (mathErr) {
                            console.warn("MathJax rendering warning:", mathErr);
                        }
                    }

                    // Update document title dynamically based on first H1 or filename
                    const h1 = contentElem.querySelector('h1');
                    if (h1) {
                        document.title = `tryhard // ${h1.textContent}`;
                    } else {
                        document.title = `tryhard // ${cleanSrc.replace('.md', '')}`;
                    }
                })
                .catch(err => {
                    showError(err.message);
                });

            function initPlayground() {
                const resValues = [224, 384, 512, 1024];
                const patchValues = [8, 14, 16, 32];
                const batchValues = [256, 1024, 8192, 32768, 131072, 524288];

                const resSlider = document.getElementById('res-slider');
                const patchSlider = document.getElementById('patch-slider');
                const batchSlider = document.getElementById('batch-slider');

                if (!resSlider || !patchSlider || !batchSlider) return;

                function update() {
                    const H = resValues[parseInt(resSlider.value) - 1];
                    const P = patchValues[parseInt(patchSlider.value)];
                    const B = batchValues[parseInt(batchSlider.value) - 1];

                    document.getElementById('res-label').textContent = `Image Resolution: ${H} x ${H}`;
                    document.getElementById('patch-label').textContent = `Patch Size P: ${P} x ${P}`;
                    document.getElementById('batch-label').textContent = `Batch Size B: ${B.toLocaleString()}`;

                    const N = Math.floor((H * H) / (P * P));
                    const matrixEntries = N * N;
                    const baselineN = Math.floor((224 * 224) / (16 * 16));
                    const mult = (matrixEntries / (baselineN * baselineN)).toFixed(1);

                    document.getElementById('stat-n').textContent = N.toLocaleString();
                    document.getElementById('stat-matrix').textContent = matrixEntries > 1000000 ? `${(matrixEntries / 1000000).toFixed(2)}M entries` : `${(matrixEntries / 1000).toFixed(1)}k entries`;
                    document.getElementById('stat-mult').textContent = `${mult}x (${mult > 1 ? '+' + ((mult - 1)*100).toFixed(0) + '%' : 'Baseline'})`;

                    // Softmax memory: B x B x 2 bytes for FP16
                    const clipBytes = B * B * 2;
                    const clipMB = clipBytes / (1024 * 1024);
                    const clipGB = clipMB / 1024;
                    document.getElementById('stat-clip').textContent = clipGB >= 1 ? `${clipGB.toFixed(2)} GB (AllGather)` : `${clipMB.toFixed(1)} MB (AllGather)`;

                    // SigLIP memory: local chunk 256 x local B x 2 bytes
                    const siglipBytes = 256 * Math.min(B, 1024) * 2;
                    const siglipMB = siglipBytes / (1024 * 1024);
                    document.getElementById('stat-siglip').textContent = `${Math.max(0.5, siglipMB).toFixed(1)} MB (Streamed)`;
                }

                resSlider.addEventListener('input', update);
                patchSlider.addEventListener('input', update);
                batchSlider.addEventListener('input', update);
                update();
            }

            function showError(msg) {
                loadingElem.style.display = 'none';
                errorElem.textContent = `[ ERROR: ${msg} ]`;
                errorElem.style.display = 'block';
            }
        });
    </script>
</body>
</html>
